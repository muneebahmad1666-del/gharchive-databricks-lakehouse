# .github/workflows/ci.yml
name: ci
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, prod]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff pytest
      - run: ruff check bronze silver airflow tests
      - run: python -m compileall -q airflow/dags bronze
      - run: pytest -q