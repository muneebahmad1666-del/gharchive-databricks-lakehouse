name: gold
version: "1.0.0"
config-version: 2
profile: gold

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

models:
  gold:
    +materialized: table
    core:
      +tags: ["core"]      # conformed dimensions + fact tables (galaxy schema)
    marts:
      +tags: ["marts"]     # business-ready tables built from dims and facts
    obt:
      +tags: ["obt"]       # optional one-big-tables (off by default)

vars:
  build_obt: true         # dbt build --vars '{build_obt: true}' to also build the OBT models
