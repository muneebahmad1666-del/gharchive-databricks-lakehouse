                field: date_key
      - name: hour_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_time')
                field: hour_key
      - name: repo_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_repo')
                field: repo_id
      - name: actor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_actor')
                field: actor_id
      - name: pr_created_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: merged_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
  - name: fact_pushes
