# No secrets here: the connection values come from environment variables.
# DATABRICKS_HOST is the workspace host WITHOUT https:// (e.g. dbc-xxxx.cloud.databricks.com)
gharchive_gold:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: gold_dev
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
    prod:
      type: databricks
      catalog: workspace
      schema: gold
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
